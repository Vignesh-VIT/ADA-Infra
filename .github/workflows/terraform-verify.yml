on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: string
      terraform_version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.7.4'
      terraform_folder:
        description: 'Terraform folder path'
        required: false
        type: string
        default: 'terraform/infra'

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_CLI: false
  TF_LOG: info

jobs:
  terraform-verify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set subscription ID
        run: |
          cd ${{ inputs.terraform_folder }}
          SUBSCRIPTION_ID=$(grep subscription_id ../${{ inputs.environment }}/terraform.tfvars | cut -d'"' -f2 || echo "${{ secrets.AZURE_SUBSCRIPTION_ID }}")
          echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV

      - name: Install tflint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Terraform linting
        id: lint
        run: |
          cd ${{ inputs.terraform_folder }}
          tflint --recursive --only=terraform_unused_declarations

      - name: Terraform fmt check
        id: fmt
        run: |
          cd ${{ inputs.terraform_folder }}
          terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform Init
        id: init
        run: |
          cd ${{ inputs.terraform_folder }}
          terraform init \
            -backend-config=../${{ inputs.environment }}/backend.tfvars \
            -reconfigure

      - name: Terraform Validate
        id: validate
        run: |
          cd ${{ inputs.terraform_folder }}
          terraform validate -no-color